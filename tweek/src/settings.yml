---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.1.1
serverless_language: node
polling_url: "https://tweek.so/api/v1/tasks?calendarId={{ calendar_id | strip }}&dateFrom={{ 'now' | date: '%s' | minus: 691200 | date: '%Y-%m-%d' }}&dateTo={{ 'now' | date: '%s' | plus: 691200 | date: '%Y-%m-%d' }}&expand=occurrences"
polling_headers: 'X-API-Key: {{ api_key }}'
polling_body: ''
id: 305419
custom_fields:
- keyname: api_key
  name: API Key
  field_type: password
  placeholder: twk_...
  description: 'Generate this in the Tweek app under Profile → API Settings. It does not expire.

    '
- keyname: calendar_id
  name: Calendar ID
  field_type: string
  placeholder: aB3xK9mQ2pL7rT5vN1wZ
  description: 'In the Tweek app, open <strong>Calendar settings</strong> and copy the <strong>Calendar ID</strong> at the bottom.<br/>Advanced: <a href="https://tweek.so/api/v1/calendars">GET /api/v1/calendars</a> with your API key also returns it.

    '
- keyname: week_start_day
  name: Week Start Day
  field_type: select
  default: monday
  options:
  - Monday
  - Sunday
- keyname: time_format
  name: Time Format
  field_type: select
  default: 12h
  options:
  - 12h
  - 24h
- keyname: date_format
  name: Date Format
  field_type: select
  default: md
  options:
  - "Month/Day (8/24)": md
  - "Day/Month (24/8)": dm
- keyname: show_completed
  name: Show Completed Tasks
  field_type: boolean
  default: true
  optional: true
  description: Completed tasks appear crossed out. Turn this off to hide them.
- keyname: show_week_number
  name: Show Week Number
  field_type: boolean
  default: false
  optional: true
  description: Adds the ISO week number to the title bar, e.g. "Tweek | Oct 12 – 18 | Week 42".
- keyname: plugin_info
  name: Tweek for TRMNL
  field_type: author_bio
  category: productivity,calendar
  github_url: https://github.com/Lucianova/trmnl-tweek
  learn_more_url: https://tweek.so
  email_address: lucianova.1992@gmail.com
  description: 'Shows your Tweek calendar as a 7-day week grid on your e-ink display, mirroring your Tweek web app — Google Calendar events included. Configure it with your Tweek API key and Calendar ID. Open source; issues and PRs welcome at the GitHub link. Unofficial; not affiliated with Tweek or TRMNL.

    '
name: Tweek
refresh_interval: 30
