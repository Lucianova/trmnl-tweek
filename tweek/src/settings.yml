---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: post
framework_version: 3.1.1
serverless_language: node
polling_url: ''
polling_headers: ''
polling_body: ''
id: 305419
custom_fields:
- keyname: api_key
  name: API Key
  field_type: password
  required: true
  placeholder: twk_...
  instructions: 'Generate this in the Tweek app under Profile → API Settings. It does not expire.

    '
- keyname: calendar_id
  name: Calendar ID
  field_type: text
  required: true
  placeholder: NLqBdgl83RaMLDJdR5fU
  instructions: 'Find it by calling GET https://tweek.so/api/v1/calendars with your API key (see the plugin README) and copying the "id" of the calendar you want.

    '
- keyname: week_start_day
  name: Week Start Day
  field_type: select
  required: true
  default: Monday
  options:
  - Monday
  - Sunday
- keyname: time_format
  name: Time Format
  field_type: select
  required: true
  default: 12h
  options:
  - 12h
  - 24h
name: Tweek
refresh_interval: 30
