---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: post
framework_version: 3.1.1
serverless_language: node
polling_url: ''
polling_headers: ''
polling_body: ''
id: 305419
custom_fields:
- keyname: api_key
  name: API Key
  field_type: password
  required: true
  placeholder: twk_...
  instructions: 'Generate this in the Tweek app under Profile → API Settings. It does not expire.

    '
- keyname: calendar_id
  name: Calendar ID
  field_type: text
  required: true
  placeholder: aB3xK9mQ2pL7rT5vN1wZ
  instructions: 'In the Tweek app, open <strong>Calendar settings</strong> and copy the <strong>Calendar ID</strong> at the bottom.<br/>Advanced: <a href="https://tweek.so/api/v1/calendars">GET /api/v1/calendars</a> with your API key also returns it.

    '
- keyname: week_start_day
  name: Week Start Day
  field_type: select
  required: true
  default: Monday
  options:
  - Monday
  - Sunday
- keyname: time_format
  name: Time Format
  field_type: select
  required: true
  default: 12h
  options:
  - 12h
  - 24h
- keyname: plugin_info
  name: Tweek for TRMNL
  field_type: author_bio
  category: productivity,calendar
  github_url: https://github.com/Lucianova/trmnl-tweek
  learn_more_url: https://tweek.so
  email_address: lucianova.1992@gmail.com
  description: 'Shows your Tweek calendar as a 7-day week grid on your e-ink display, mirroring your Tweek web app — Google Calendar events included. Configure it with your Tweek API key and Calendar ID. Open source; issues and PRs welcome at the GitHub link. Unofficial; not affiliated with Tweek or TRMNL.

    '
name: Tweek
refresh_interval: 30
