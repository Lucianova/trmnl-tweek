# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
watch:
  - .trmnlp.yml
  - src

# Disable transform so mock variables below are used for local UI preview.
# Remove this line (or set to 'enabled') to test with real Tweek API calls.
transform_runtime: disabled

# Test values for custom form fields (used during local development only)
custom_fields:
  api_key: "twk_your_api_key_here"
  calendar_id: "your_calendar_id_here"
  week_start_day: "Monday"
  time_format: "12h"

# Mock the {{ trmnl }} global for local preview
variables:
  trmnl:
    user:
      name: "Johnathan Lewis"
      time_zone: "Buenos Aires"
      time_zone_iana: "America/Argentina/Buenos_Aires"
      utc_offset: -10800
    device:
      height: 480
      width: 800
    system:
      timestamp_utc: 1787918400
    plugin_settings:
      instance_name: "Tweek"
      strategy: "polling"
      dark_mode: "no"
  week_label: "Aug 24–30"
  error: null
  # Sample week for local preview. Tasks are pre-ordered the way the transform
  # sorts them (all-day → timed by time → to-dos) since full.liquid renders as-is.
  days:
    - name: Mon
      date: "24"
      full_date: "2026-08-24"
      overflow: 0
      tasks:
        - { text: "Team standup", time: "9:00 AM", gcal: true, done: false }
        - { text: "Submit expense report", time: null, gcal: false, done: true }
    - name: Tue
      date: "25"
      full_date: "2026-08-25"
      overflow: 0
      tasks:
        # All-day Google event: API returns isoDate: null — flagged all_day, gets "(all-day)" label
        - { text: "Design conference", time: null, gcal: true, all_day: true, done: false }
        # Recurring Google event
        - { text: "Yoga class (recurring)", time: "7:00 AM", gcal: true, done: false }
        - { text: "Lunch with Sam", time: "12:30 PM", gcal: true, done: false }
    - name: Wed
      date: "26"
      full_date: "2026-08-26"
      overflow: 0
      tasks:
        - { text: "Design review", time: "11:00 AM", gcal: true, done: false }
        - { text: "Water the plants", time: null, gcal: false, done: false }
    - name: Thu
      date: "27"
      full_date: "2026-08-27"
      overflow: 0
      tasks:
        - { text: "1:1 with manager", time: "3:00 PM", gcal: true, done: false }
        - { text: "Renew passport", time: null, gcal: false, done: false }
    - name: Fri
      date: "28"
      full_date: "2026-08-28"
      overflow: 2
      tasks:
        - { text: "Team standup", time: "9:00 AM", gcal: true, done: false }
        - { text: "Team retro", time: "4:00 PM", gcal: true, done: false }
        - { text: "Gym", time: "6:00 PM", gcal: true, done: false }
        - { text: "Ship release", time: null, gcal: false, done: false }
        - { text: "Reply to emails", time: null, gcal: false, done: true }
        - { text: "Grocery run", time: null, gcal: false, done: false }
        - { text: "Book flights", time: null, gcal: false, done: false }
        - { text: "Pick up package", time: null, gcal: false, done: false }
    - name: Sat
      date: "29"
      full_date: "2026-08-29"
      overflow: 0
      tasks:
        - { text: "Farmers market", time: "10:00 AM", gcal: true, done: false }
    - name: Sun
      date: "30"
      full_date: "2026-08-30"
      overflow: 0
