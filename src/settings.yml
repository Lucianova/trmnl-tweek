---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: post
framework_version: 3.1.1
serverless_language: node
polling_url: ''
polling_headers: ''
polling_body: ''
id: 305419
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: api_key
  name: API Key
  field_type: password
  required: true
  placeholder: twk_...
  instructions: 'Generate this in the Tweek app under Profile → API Settings. It does not expire.

    '
- keyname: calendar_name
  name: Calendar Name
  field_type: text
  required: false
  placeholder: My calendar
  instructions: Leave blank to use your default calendar.
- keyname: week_start_day
  name: Week Start Day
  field_type: select
  required: true
  default: Monday
  options:
  - Monday
  - Sunday
- keyname: time_format
  name: Time Format
  field_type: select
  required: true
  default: 12h
  options:
  - 12h
  - 24h
name: Tweek
description: Your Tweek Tasks and Events
refresh_interval: 30
